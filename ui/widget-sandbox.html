<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NINA Widget</title>
  <!-- Sandboxed page (manifest "sandbox"): runs the user's own HTML for a
       custom new tab widget, isolated from NINA and from Chrome's APIs. The
       code arrives via postMessage from ui/newtab-widgets.js. -->
  <style>
    html, body { margin: 0; height: 100%; background: transparent; color: #e4e4e7; font-family: system-ui, sans-serif; overflow: auto; }
  </style>
  <script src="widget-sandbox.js"></script>
</head>
<body></body>
</html>
