<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>NINA</title>
  <style>
    :root { --bg: #111214; --card: #1e1f22; --aqua: #80D8DF; --aqua-dim: rgba(128,216,223,.12); --lime: #a3e635; --lime-dim: rgba(163,230,53,.12); }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: #f4f4f5; font-family: system-ui, "Segoe UI", sans-serif; }
    body { width: 340px; padding: 16px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    header img { width: 34px; height: 34px; border-radius: 10px; }
    header h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 700; }
    .icon-btn { width: 34px; height: 34px; border: 0; border-radius: 999px; background: none; color: #a1a1aa; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .icon-btn:hover { background: rgba(255,255,255,.06); color: #fff; }
    .icon-btn svg { width: 20px; height: 20px; }
    .site { margin: -6px 0 12px; font-size: 12px; color: #71717a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card { background: var(--card); border-radius: 24px; padding: 16px 18px 12px; margin-bottom: 12px; }
    .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
    .card-head svg { width: 18px; height: 18px; }
    .card-head .val { margin-left: auto; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; }
    #speed-card .card-head svg { color: var(--aqua); }
    #speed-card .val { background: rgba(0,106,114,.6); color: var(--aqua); }
    #audio-card .card-head svg { color: #d4d4d8; }
    #audio-card .val { background: rgba(77,124,15,.45); color: var(--lime); }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; cursor: pointer; margin: 0; }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track { height: 28px; border-radius: 28px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; margin-top: -6px; height: 40px; width: 10px; border-radius: 999px; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    #speed::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--aqua) var(--p, 0%), var(--aqua-dim) var(--p, 0%)); }
    #speed::-webkit-slider-thumb { background: var(--aqua); }
    #audio::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--lime) var(--p, 0%), var(--lime-dim) var(--p, 0%)); }
    #audio::-webkit-slider-thumb { background: var(--lime); }
    .presets { display: flex; gap: 6px; margin-top: 6px; }
    .presets button { flex: 1; height: 28px; border: 1px solid rgba(255,255,255,.08); border-radius: 999px; background: none; color: #a1a1aa; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
    .presets button:hover { color: #fff; border-color: rgba(128,216,223,.5); }
    .presets button.on { background: rgba(128,216,223,.15); color: #fff; border-color: transparent; }
    #audio-card .presets button:hover { border-color: rgba(163,230,53,.5); }
    #audio-card .presets button.on { background: rgba(163,230,53,.15); }
    .note { padding: 14px 4px 0; font-size: 12px; color: #71717a; text-align: center; }
    .disabled .card { opacity: .45; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <img src="../icons/icon128.png" alt="">
    <h1>Nina</h1>
    <button class="icon-btn" id="reset" title="Auf 1x / 100 % zurücksetzen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0115.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 01-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
    </button>
    <button class="icon-btn" id="settings" title="Einstellungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
  </header>
  <div class="site" id="site"></div>

  <div id="controls">
    <section class="card" id="speed-card">
      <div class="card-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 13l4-4"/><path d="M4.9 19.1A10 10 0 1119.1 19.1"/></svg>
        Geschwindigkeit <span class="val" id="speed-val">1.00x</span>
      </div>
      <input type="range" id="speed" min="0.25" max="4" step="0.05" value="1">
      <div class="presets" id="speed-presets">
        <button data-v="1">1x</button><button data-v="1.25">1.25</button><button data-v="1.5">1.5</button><button data-v="2">2x</button><button data-v="3">3x</button>
      </div>
    </section>

    <section class="card" id="audio-card">
      <div class="card-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/></svg>
        Audio (Verstärkung) <span class="val" id="audio-val">100%</span>
      </div>
      <input type="range" id="audio" min="0" max="600" step="5" value="100">
      <div class="presets" id="audio-presets">
        <button data-v="50">50%</button><button data-v="100">100%</button><button data-v="200">200%</button><button data-v="400">400%</button><button data-v="600">600%</button>
      </div>
    </section>
  </div>
  <div class="note" id="note" hidden></div>

  <script src="../lib/hotkeys-shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
